[workspace]
members = ["apps/client", "apps/server", "crates/core", "crates/network", "crates/persistence", "crates/auth"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false }
avian3d = { git = "https://github.com/avianphysics/avian", rev = "1070759b2145dc078abedace91dc7fe78013a45c", default-features = false, features = ["3d", "parry-f32"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
renet = "=2.0.0"
renet_netcode = "=2.0.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
theia-network = { path = "crates/network" }
theia-persistence = { path = "crates/persistence" }
theia-auth = { path = "crates/auth" }
theia-core = { path = "crates/core" }

[profile.release]
debug = 1
