[workspace]
members = ["apps/client", "apps/server", "crates/network"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light",
    "bevy_window", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_shader",
    "bevy_color", "x11", "wayland", "bevy_ui", "bevy_ui_render", "bevy_text",
    "default_font", "png", "jpeg", "bevy_gltf", "reflect_auto_register", "gltf_animation",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
theia-network = { path = "crates/network" }

[profile.release]
debug = 1
