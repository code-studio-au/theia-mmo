[package]
name = "theia-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
public-client = []

[dependencies]
bevy = { workspace = true, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light",
    "bevy_window", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_shader",
    "bevy_color", "x11", "wayland", "bevy_ui", "bevy_ui_render", "bevy_text",
    "default_font", "png", "jpeg", "bevy_gltf", "reflect_auto_register", "gltf_animation",
    "mesh_picking", "pbr_light_textures",
    "bevy_audio", "wav", "bevy_ui_widgets", "ui_picking",
] }
bevy_sprinkles = { path = "../../third_party/sprinkles/crates/bevy_sprinkles" }
avian3d.workspace = true
serde_json.workspace = true
serde.workspace = true
raw-window-handle = "0.6"
theia-network.workspace = true
theia-core.workspace = true
theia-vfx = { path = "../../crates/vfx" }
tokio.workspace = true
uuid = "1"
