[package]
name = "theia-zone-editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light",
    "bevy_window", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_shader",
    "bevy_color", "x11", "wayland", "bevy_ui", "bevy_ui_render", "bevy_text",
    "default_font", "png", "bevy_gltf", "gltf_animation", "bevy_scene", "mesh_picking", "bevy_ui_widgets", "ui_picking",
] }
bevy_sprinkles = { path = "../../third_party/sprinkles/crates/bevy_sprinkles" }
bevy_sprinkles_editor = { path = "../../third_party/sprinkles/crates/bevy_sprinkles_editor" }
avian3d.workspace = true
ron.workspace = true
serde_json.workspace = true
serde.workspace = true
theia-core.workspace = true
theia-network.workspace = true
theia-vfx = { path = "../../crates/vfx" }
theia-zone = { path = "../../crates/zone" }

[dev-dependencies]
tokio.workspace = true
