name: Build Linux client release candidate

on:
  workflow_dispatch:
    inputs:
      client_version:
        description: New immutable client version
        required: true
        type: string
      asset_commit:
        description: Exact private build-input commit (required for a bundled release)
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: game-downloads-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require a reviewed public asset list
        env:
          ASSET_COMMIT: ${{ inputs.asset_commit }}
        run: |
          test -s release/linux-client-files.json
          bundled=$(jq -r 'has("bundle")' release/linux-client-files.json)
          if [[ "$bundled" == true ]]; then
            test -n "$ASSET_COMMIT"
          else
            test -z "$ASSET_COMMIT"
          fi
      - name: Check the asset bundle source
        if: inputs.asset_commit != ''
        env:
          ASSET_COMMIT: ${{ inputs.asset_commit }}
          ASSET_REPO: ${{ vars.THEIA_LINUX_ASSETS_REPOSITORY }}
        run: |
          [[ "$ASSET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ASSET_REPO" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ]]
          status=$(curl --silent --show-error --max-time 15 --output /dev/null \
            --write-out '%{http_code}' "https://api.github.com/repos/$ASSET_REPO")
          [[ "$status" == 404 ]] || { echo 'Expected a private asset repository'; exit 1; }
      - name: Fetch the pinned asset bundle
        if: inputs.asset_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.THEIA_LINUX_ASSETS_REPOSITORY }}
          ref: ${{ inputs.asset_commit }}
          ssh-key: ${{ secrets.THEIA_LINUX_ASSETS_SSH_KEY }}
          path: .release-assets
          sparse-checkout: theia-linux-assets.tar.gz
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y binutils pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: cargo build --release --locked -p theia-client --features public-client -j 2
      - name: Verify the public client rejects a bare launch
        run: |
          if output=$(timeout 10s target/release/theia-client 2>&1); then
            echo 'Expected the public client to require sign-in through the launcher.'
            exit 1
          fi
          [[ "$output" == *"Start Theia Online from the launcher to sign in"* ]]
      - name: Strip the distributable client and export the approved payload
        env:
          CLIENT_VERSION: ${{ inputs.client_version }}
          ASSET_COMMIT: ${{ inputs.asset_commit }}
        run: |
          bundle=()
          if [[ -n "$ASSET_COMMIT" ]]; then
            bundle=(--asset-bundle .release-assets/theia-linux-assets.tar.gz)
          fi
          python3 tools/build_linux_client_candidate.py "$RUNNER_TEMP/client-export" \
            --version "$CLIENT_VERSION" "${bundle[@]}"
      - name: Verify the exported client enables the full Theia playtest
        env:
          PUBLIC_REALM_PROFILE: ${{ vars.THEIA_PUBLIC_REALM_PROFILE }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          from shutil import copyfile
          from theia_playtest_profile import arguments, verify_report

          profile = json.loads(os.environ['PUBLIC_REALM_PROFILE'])
          payload = Path(os.environ['RUNNER_TEMP']) / 'client-export/payload'
          if profile['game_arguments'] != arguments(payload, 'client'):
              raise SystemExit('The signed realm profile must use the full Theia playtest arguments')
          with TemporaryDirectory() as directory:
              client = Path(directory) / 'theia-client'
              copyfile(payload / 'theia-client', client)
              client.chmod(0o700)
              output = subprocess.check_output([client, *profile['game_arguments'], '--configuration-report'],
                                               cwd=payload, text=True, timeout=30)
          report = json.loads(output[output.rfind('\n{') + 1:])
          verify_report(report)
          print('Verified the full Theia playtest with the public realm’s runtime configuration')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theia-linux-client-release
          path: ${{ runner.temp }}/client-export
          if-no-files-found: error
