name: Publish Linux downloads to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: First publish, or replace an existing verified release
        type: choice
        options: [update, first]
        default: update
      expected_previous:
        description: Exact client version currently live (required for update)
        type: string
      candidate_run:
        description: Successful main-branch run containing the approved Linux client export
        required: true
        type: string
      client_version:
        description: Approved client version in that export
        required: true
        type: string
      launcher_version:
        description: New immutable version for the Linux launcher package
        required: true
        type: string
      launcher_notes:
        description: Reviewed public changes, one per line (required when launcher advances)
        type: string
      client_notes:
        description: Reviewed public changes, one per line (required when client advances)
        type: string
      delta_base_run:
        description: Optional successful main run with the previous Linux client export
        type: string

permissions:
  contents: read

concurrency:
  group: game-downloads-pages
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: game-downloads-release
    outputs:
      feed_sha256: ${{ steps.stage.outputs.feed_sha256 }}
      launcher_sha256: ${{ steps.stage.outputs.launcher_sha256 }}
      launcher_feed_sha256: ${{ steps.stage.outputs.launcher_feed_sha256 }}
      realm_feed_sha256: ${{ steps.stage.outputs.realm_feed_sha256 }}
      client_sha256: ${{ steps.stage.outputs.client_sha256 }}
      news_sha256: ${{ steps.stage.outputs.news_sha256 }}
      bundle_checksums: ${{ steps.stage.outputs.bundle_checksums }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          DELTA_BASE_RUN: ${{ inputs.delta_base_run }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          for run in "$CANDIDATE_RUN" "$DELTA_BASE_RUN"; do
            [[ -n "$run" ]] || continue
            [[ "$run" =~ ^[0-9]+$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
              jq -e --arg repo "$GITHUB_REPOSITORY" '
                .conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo
                and .path == ".github/workflows/build-linux-client-release.yml"'
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: theia-linux-client-release
          path: ${{ runner.temp }}/client-export
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.delta_base_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.delta_base_run }}
          name: theia-linux-client-release
          path: ${{ runner.temp }}/delta-base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/launcher/native-auth/package-lock.json
      - name: Build the pinned Cognito SRP client
        working-directory: apps/launcher/native-auth
        run: npm ci --no-audit && npm run build && npm test
      - name: Sign and stage approved Linux downloads
        id: stage
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.THEIA_RELEASE_SIGNING_KEY }}
          PUBLIC_REALM_PROFILE: ${{ vars.THEIA_PUBLIC_REALM_PROFILE }}
          CLIENT_VERSION: ${{ inputs.client_version }}
          LAUNCHER_VERSION: ${{ inputs.launcher_version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          EXPECTED_PREVIOUS: ${{ inputs.expected_previous }}
          LAUNCHER_NOTES: ${{ inputs.launcher_notes }}
          CLIENT_NOTES: ${{ inputs.client_notes }}
          DELTA_BASE_RUN: ${{ inputs.delta_base_run }}
        run: |
          jq -e --arg version "$CLIENT_VERSION" '.version == $version' "$RUNNER_TEMP/client-export/client-release.json"
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$PUBLIC_REALM_PROFILE" || { echo 'Set the public Theia realm profile before publishing.'; exit 1; }
          printf '%s\n' "$PUBLIC_REALM_PROFILE" > "$RUNNER_TEMP/public-realm.json"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/theia-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          unset RELEASE_SIGNING_KEY
          umask 022
          release_args=(--live-mode "$RELEASE_MODE")
          if [[ "$RELEASE_MODE" == update ]]; then
            test -n "$EXPECTED_PREVIOUS"
            release_args+=(--expected-previous "$EXPECTED_PREVIOUS")
          fi
          delta_args=()
          if [[ -n "$DELTA_BASE_RUN" ]]; then
            delta_args=(--delta-base "$RUNNER_TEMP/delta-base")
          fi
          python3 tools/stage_hosted_release.py "$RUNNER_TEMP/client-export" "$RUNNER_TEMP/game-pages" \
            --launcher-version "$LAUNCHER_VERSION" --signing-key "$key" \
            --native-auth-bundle apps/launcher/native-auth/dist/cognito-sign-in.cjs \
            --public-realm-profile "$RUNNER_TEMP/public-realm.json" \
            --launcher-notes="$LAUNCHER_NOTES" --client-notes="$CLIENT_NOTES" \
            --bundle-initial-install "${release_args[@]}" "${delta_args[@]}"
          cd "$RUNNER_TEMP/game-pages/downloads"
          printf 'news_sha256=%s\n' "$(sha256sum release-news.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'feed_sha256=%s\n' "$(sha256sum development.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'launcher_sha256=%s\n' "$(sha256sum theia-launcher_amd64.deb | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'launcher_feed_sha256=%s\n' "$(sha256sum launcher.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'realm_feed_sha256=%s\n' "$(sha256sum realm.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          client_hash=$(jq -er '.files[] | select(.path == "theia-client") | .sha256' "$RUNNER_TEMP/client-export/client-release.json")
          printf 'client_sha256=%s\n' "$client_hash" >> "$GITHUB_OUTPUT"
          bundle_index="bundles/$CLIENT_VERSION.json"
          bundle_digests=$(jq -er .payload "$bundle_index" | base64 --decode | jq -er '.entries[].sha256')
          {
            printf 'bundle_checksums<<BUNDLE_CHECKSUMS\n'
            sha256sum "$bundle_index"
            while read -r digest; do
              sha256sum "blobs/$digest"
            done <<< "$bundle_digests"
            printf 'BUNDLE_CHECKSUMS\n'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/game-pages

  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: pages
      - name: Verify live feed, launcher and install bundles
        env:
          FEED_SHA256: ${{ needs.stage.outputs.feed_sha256 }}
          LAUNCHER_SHA256: ${{ needs.stage.outputs.launcher_sha256 }}
          LAUNCHER_FEED_SHA256: ${{ needs.stage.outputs.launcher_feed_sha256 }}
          REALM_FEED_SHA256: ${{ needs.stage.outputs.realm_feed_sha256 }}
          LAUNCHER_VERSION: ${{ inputs.launcher_version }}
          CLIENT_SHA256: ${{ needs.stage.outputs.client_sha256 }}
          NEWS_SHA256: ${{ needs.stage.outputs.news_sha256 }}
          BUNDLE_CHECKSUMS: ${{ needs.stage.outputs.bundle_checksums }}
        run: |
          set -o pipefail
          base=https://code-studio-au.github.io/theia-mmo/downloads
          verify() {
            local path="$1" expected="$2" actual
            actual=$(curl --fail --silent --show-error --max-time 45 \
              --header 'Cache-Control: no-cache' "$base/$path?build=$GITHUB_RUN_ID" | sha256sum) || return 1
            [[ "${actual%% *}" == "$expected" ]]
          }
          verify_bundles() {
            local digest path
            while read -r digest path; do
              verify "$path" "$digest" || return 1
            done <<< "$BUNDLE_CHECKSUMS"
          }
          for attempt in {1..12}; do
            if verify development.json "$FEED_SHA256" \
              && verify launcher.json "$LAUNCHER_FEED_SHA256" \
              && verify realm.json "$REALM_FEED_SHA256" \
              && verify theia-launcher_amd64.deb "$LAUNCHER_SHA256" \
              && verify "theia-launcher_${LAUNCHER_VERSION}_amd64.deb" "$LAUNCHER_SHA256" \
              && verify "blobs/$CLIENT_SHA256" "$CLIENT_SHA256" \
              && verify release-news.json "$NEWS_SHA256" \
              && verify_bundles; then
              exit 0
            fi
            sleep 10
          done
          echo 'The live release does not yet match the approved artifact.' >&2
          exit 1

      - name: Rebuild the website with the verified release news
        if: vars.ENABLE_WEBSITE_RELEASE_NEWS == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.THEIA_WEBSITE_NEWS_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]] || ! gh workflow run deploy.yml --repo code-studio-au/theia-website --ref main; then
            echo '::warning::Game downloads are live. Dispatch the website workflow manually to import the signed release notes.'
            exit 1
          fi
