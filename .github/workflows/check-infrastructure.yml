name: AWS infrastructure checks

on:
  pull_request:
    paths:
      - infrastructure/aws/**
      - .github/workflows/check-infrastructure.yml
  push:
    branches: [main]
    paths:
      - infrastructure/aws/**
      - .github/workflows/check-infrastructure.yml

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: infrastructure/aws/.nvmrc
          cache: npm
          cache-dependency-path: infrastructure/aws/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run synth
      - run: npm exec -- cdk synth --app "node bin/theia-deployment-identity.ts" --no-lookups --output cdk.out/identity --quiet
