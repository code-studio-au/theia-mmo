name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 55 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window and audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Start a new key so old multi-gigabyte workspace caches aren't restored.
          prefix-key: dependency-only-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build workspace test binaries
        run: cargo test --locked --workspace --no-run -j 2
      # Keep test targets running serially for the socket-based fixtures.
      - run: cargo test --locked --workspace --no-fail-fast -j 1

  asset-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-assets.txt
      - run: python -m pip install -r tools/requirements-assets.txt
      - run: python -m unittest discover -s tools/asset_tests
      - run: python -m unittest discover -s tools -p test_align_glb.py
