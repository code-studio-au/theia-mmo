[package]
name = "theia-realm-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sigv4 = "1"
base64 = "0.22"
lambda_runtime = "1"
libc = "0.2"
quick-xml = { version = "0.40", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "signal"] }
