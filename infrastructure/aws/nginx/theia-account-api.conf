server {
    listen 443 ssl;
    server_name api.theiaonline.com;
    ssl_certificate /etc/letsencrypt/live/api.theiaonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.theiaonline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /v1/me/characters {
        if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
        proxy_set_header Host 127.0.0.1:5050;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://127.0.0.1:5050;
    }

    location / { return 404; }
}
